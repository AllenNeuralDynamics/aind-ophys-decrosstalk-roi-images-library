[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-decrosstalk-roi-images-library"
description = "Paired-plane crosstalk removal for AIND population ophys"
license = "MIT"
# Pinned to 3.10 by suite2p==0.14.3
requires-python = ">=3.10,<3.11"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.0.0"

dependencies = [
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.2.0",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@v0.3.1",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/aind-log-utils.git@f09685e#subdirectory=python",
    "aind-ophys-utils==0.2.0",
    "cellpose==2.2.3",
    "suite2p==0.14.3",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "h5py==3.16.0",
    "matplotlib==3.10.9",
    "pydantic==2.11.10",
    "pydantic-settings==2.14.2",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/aind-ophys-decrosstalk-roi-images-library"

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = [
    "*__init__*",
    "*/decrosstalk.py",
    "*/paired_plane_registration.py",
    "*/job.py",
]
source = ["aind_ophys_decrosstalk_roi_images_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 79
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
